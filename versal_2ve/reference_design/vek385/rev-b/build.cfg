# Build configuration switches for the vek385 rev-b reference design.

# MIPI: default is 0 (file-based inferencing).
#   0 - File-based inferencing; MIPI/ISP streaming nodes and the MIPI
#       subsystem are not included in the hardware or devicetree.
#   1 - Stream-based inferencing; include MIPI/ISP streaming devicetree
#       nodes and enable the MIPI subsystem in hardware.
MIPI=0
