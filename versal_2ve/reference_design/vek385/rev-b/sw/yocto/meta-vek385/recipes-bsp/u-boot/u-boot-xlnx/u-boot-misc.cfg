# Restore the UFS preboot removed by dae99a04. Without it UFS is not
# enumerated (`scsi 0` missing) and the kernel ufshcd-versal2 probe fails
# (NOP OUT failed), so the UFS rootfs cannot boot. `mw 0xF1060A00 0x1 1` is
# the minimal write the Linux driver needs alongside the UFS bring-up.
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="if test -n \"${firstboot_saveenv}\"; then run firstboot_saveenv; fi; mw 0xF1D61008 1;mw 0xF1090030 1;mw 0xF1D21008 0x1;mw 0xF1A20324 0xF;mw 0xF1A40004 0x2;mw 0xF1A40000 0x2;mw 0xEB410280 0x1;mw 0xEB410284 0x1;mw 0xEB410288 0x1;mw 0xEB41028C 0x1;mw 0xEB410290 0x1;mw 0xEB410294 0x1;mw 0xEB410298 0x1;mw 0xEB41029C 0x1;mw 0xF1060A00 0x1 1;mw 0xF1060A08 0xF;usb reset;ufs init 0;run scsi_init;"
